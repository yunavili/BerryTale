<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Berry tale</title>
        <link rel="stylesheet" href="/styles.css">
        <link rel="stylesheet" href="index_style.css">
    </head>
    <body>
        <main>
            <section id="start-screen">
                <h1>BERRY TALE <img style="width: 60px; height: 60px;" src="image/blueberry.png" alt="blueberry"></h1>
                <nav>
                    <button id="start-btn">START</button>
                    <a href="leaderboard.html">LEADER BOARD</a>
                </nav>
            </section>

            <!-- collect player's name after clicking the start button -->
            <dialog id="name-input">
                <h2>Enter your name</h2>
                <form action="story.html" method="get">
                    <label for="player-name">Player name: </label>
                    <input id="player-name" type="text" name="player-name">
                    <button type="submit">Submit</button>
                </form>
            </dialog>
        </main>
    </body>
</html>
